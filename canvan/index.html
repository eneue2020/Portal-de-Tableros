  const el = m.el;
  const titleIn = $('#tTitle', el), descIn = $('#tDesc', el), dueIn = $('#tDue', el);

  setTimeout(() => { titleIn.focus(); if (!isNew) titleIn.setSelectionRange(titleIn.value.length, titleIn.value.length); }, 60);
  titleIn.addEventListener('input', () => { draft.title = titleIn.value; });
  titleIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSave(); } });
  const growDesc = () => { descIn.style.height = 'auto'; descIn.style.height = Math.min(360, Math.max(110, descIn.scrollHeight + 2)) + 'px'; };
  descIn.addEventListener('input', () => { draft.desc = descIn.value; growDesc(); });
  setTimeout(growDesc, 0);
  $('#tCol', el).addEventListener('change', e => { targetCol = e.target.value; updateDuePreview(); });

  $('#tPrio', el).addEventListener('click', e => {
    const bt = e.target.closest('[data-p]'); if (!bt) return;
    draft.priority = bt.dataset.p;
    $$('#tPrio button', el).forEach(x => x.classList.toggle('on', x === bt));
  });

  function updateDuePreview() {
    const pv = $('#duePreview', el);
    if (!draft.due) { pv.textContent = ''; pv.className = 'right due-preview'; return; }
    const done = b.columns.find(c => c.id === targetCol)?.isDone;
    const info = dueInfo(draft, done);
    const diff = info.diff;
    pv.textContent = diff === 0 ? 'Hoy' : diff === 1 ? 'Mañana' : diff === -1 ? 'Ayer' : diff < 0 ? `Hace ${-diff} días` : `En ${diff} días`;
    pv.className = 'right due-preview ' + (info.cls === 'overdue' ? 'overdue' : info.cls === 'soon' ? 'soon' : 'ok');
  }
  dueIn.addEventListener('change', () => { draft.due = dueIn.value || ''; updateDuePreview(); });
  $('.quick-dates', el).addEventListener('click', e => {
    const bt = e.target.closest('[data-days]'); if (!bt) return;
    draft.due = bt.dataset.days === 'clear' ? '' : fmtISO(addDays(new Date(), +bt.dataset.days));
    dueIn.value = draft.due;
    updateDuePreview();
  });
  updateDuePreview();

  /* Etiquetas */
  const labelWrap = $('#tLabels', el);
  function renderLabels() {
    labelWrap.innerHTML = b.labels.map(l => {
      const on = draft.labels.includes(l.id);
      return `<button type="button" class="label-opt ${on ? 'on' : ''}" data-id="${l.id}" style="--lc:${esc(l.color)}">${on ? icon('check') : '<i></i>'}${esc(l.name)}</button>`;
    }).join('') + `<button type="button" class="label-opt add" data-add>${icon('plus')}Nueva</button>`;
  }
  labelWrap.addEventListener('click', e => {
    const opt = e.target.closest('.label-opt'); if (!opt) return;
    if (opt.hasAttribute('data-add')) {
      const inp = document.createElement('input');
      inp.className = 'inp label-new';
      inp.placeholder = 'Nombre y Enter';
      inp.maxLength = 30;
      opt.replaceWith(inp);
      inp.focus();
      let finished = false;
      const finish = commit => {
        if (finished) return; finished = true;
        const name = inp.value.trim();
        if (commit && name) {
          const existingL = b.labels.find(l => norm(l.name) === norm(name));
          const lab = existingL || { id: uid(), name, color: LABEL_COLORS[b.labels.length % LABEL_COLORS.length] };
          if (!existingL) { b.labels.push(lab); save(); }
          if (!draft.labels.includes(lab.id)) draft.labels.push(lab.id);
        }
        renderLabels();
      };
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); finish(true); }
        else if (ev.key === 'Escape') { ev.stopPropagation(); finish(false); }
      });
      inp.addEventListener('blur', () => finish(true));
      return;
    }
    const id = opt.dataset.id;
    draft.labels = draft.labels.includes(id) ? draft.labels.filter(x => x !== id) : [...draft.labels, id];
    renderLabels();
  });
  renderLabels();

  /* Checklist */
  const clList = $('#clList', el), clInput = $('#clInput', el);
  function renderChecklist() {
    clList.innerHTML = draft.checklist.map(it => `<li class="cl-item ${it.done ? 'done' : ''}" data-id="${it.id}">
      <label class="checkbox"><input type="checkbox" ${it.done ? 'checked' : ''} aria-label="Completado"><span>${icon('check')}</span></label>
      <input class="cl-text" value="${esc(it.text)}" maxlength="200" aria-label="Elemento">
      <button type="button" class="icon-btn sm cl-del" title="Eliminar">${icon('x')}</button>
    </li>`).join('');
    updateChecklistProgress();
  }
  function updateChecklistProgress() {
    const n = draft.checklist.length, d = draft.checklist.filter(i => i.done).length;
    $('#clProg', el).hidden = !n;
    $('#clBar', el).style.width = n ? (d / n * 100) + '%' : '0';
    $('#clText', el).textContent = n ? `${d}/${n} · ${Math.round(d / n * 100)}%` : '';
  }
  const itemOf = node => draft.checklist.find(i => i.id === node.closest('.cl-item')?.dataset.id);
  clList.addEventListener('change', e => {
    if (e.target.type !== 'checkbox') return;
    const it = itemOf(e.target); if (!it) return;
    it.done = e.target.checked;
    e.target.closest('.cl-item').classList.toggle('done', it.done);
    updateChecklistProgress();
  });
  clList.addEventListener('input', e => { if (e.target.classList.contains('cl-text')) { const it = itemOf(e.target); if (it) it.text = e.target.value; } });
  clList.addEventListener('keydown', e => { if (e.target.classList.contains('cl-text') && e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); clInput.focus(); } });
  clList.addEventListener('click', e => {
    if (!e.target.closest('.cl-del')) return;
    const it = itemOf(e.target);
    draft.checklist = draft.checklist.filter(i => i !== it);
    renderChecklist();
  });
  const addItem = () => {
    const text = clInput.value.trim(); if (!text) return;
    draft.checklist.push({ id: uid(), text, done: false });
    clInput.value = '';
    renderChecklist();
    clInput.focus();
  };
  clInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); addItem(); } });
  $('#clAdd', el).onclick = addItem;
  renderChecklist();

  /* Guardar / eliminar / duplicar */
  function doSave() {
    const pending = clInput.value.trim();
    if (pending) { draft.checklist.push({ id: uid(), text: pending, done: false }); clInput.value = ''; }
    draft.title = titleIn.value.trim();
    if (!draft.title) {
      titleIn.classList.add('invalid'); titleIn.focus();
      setTimeout(() => titleIn.classList.remove('invalid'), 600);
      toast('Ponle un título a la tarea', { type: 'warning' });
      return;
    }
    draft.desc = draft.desc.trim();
    draft.checklist = draft.checklist.map(i => ({ ...i, text: i.text.trim() })).filter(i => i.text);
    draft.labels = draft.labels.filter(id => b.labels.some(l => l.id === id));
    draft.updatedAt = Date.now();
    const col = b.columns.find(c => c.id === targetCol);
    if (isNew) {
      if (col.isDone) draft.completedAt = Date.now();
      b.cards[draft.id] = draft;
      col.cardIds.push(draft.id);
    } else {
      const prev = colOfCard(draft.id, b);
      b.cards[draft.id] = draft;
      if (prev && prev.id !== col.id) {
        prev.cardIds = prev.cardIds.filter(x => x !== draft.id);
        col.cardIds.push(draft.id);
        if (col.isDone && !prev.isDone) draft.completedAt = Date.now();
        else if (!col.isDone && prev.isDone) draft.completedAt = null;
      }
    }
    save();
    m.close();
    render();
    flashCard(draft.id);
    toast(isNew ? 'Tarea creada' : 'Cambios guardados', { type: 'success' });
    wipCheck(col);
  }
  $('#tSave', el).onclick = doSave;
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doSave(); } });

  if (!isNew) {
    $('#tDelete', el).onclick = () => {
      m.close();
      withUndo('Tarea eliminada', () => {
        const c = colOfCard(cardId, b);
        if (c) c.cardIds = c.cardIds.filter(x => x !== cardId);
        delete b.cards[cardId];
      });
    };
    $('#tDup', el).onclick = () => {
      const src = b.cards[cardId];
      const copy = newCard({ ...clone(src), id: uid(), title: src.title + ' (copia)', checklist: src.checklist.map(i => ({ ...i, id: uid() })), createdAt: Date.now(), updatedAt: Date.now() });
      const c = colOfCard(cardId, b);
      b.cards[copy.id] = copy;
      c.cardIds.splice(c.cardIds.indexOf(cardId) + 1, 0, copy.id);
      save();
      m.close();
      render();
      flashCard(copy.id);
      toast('Tarea duplicada', { type: 'success' });
    };
  }
}

function wipCheck(col) {
  if (col.wip && col.cardIds.length > col.wip) toast(`“${col.title}” supera su límite de ${col.wip} tareas`, { type: 'warning' });
}

/* =========================================================
   Columnas
   ========================================================= */
function openColumnMenu(btn) {
  const b = board();
  const col = b.columns.find(c => c.id === btn.closest('.column').dataset.id);
  const idx = b.columns.indexOf(col);
  showMenu(btn, [
    { icon: 'plus', label: 'Añadir tarea', fn: () => openTaskModal(null, col.id) },
    { icon: 'sliders', label: 'Configurar columna', fn: () => openColumnModal(col) },
    { divider: true },
    { icon: 'sort', label: 'Ordenar por prioridad', disabled: col.cardIds.length < 2, fn: () => sortColumn(col, 'priority') },
    { icon: 'calendar', label: 'Ordenar por fecha límite', disabled: col.cardIds.length < 2, fn: () => sortColumn(col, 'due') },
    { divider: true },
    { icon: 'arrowLeft', label: 'Mover a la izquierda', disabled: idx === 0, fn: () => moveColumn(col, -1) },
    { icon: 'arrowRight', label: 'Mover a la derecha', disabled: idx === b.columns.length - 1, fn: () => moveColumn(col, 1) },
    { divider: true },
    { icon: 'eraser', label: 'Vaciar columna', danger: true, disabled: !col.cardIds.length, fn: () => clearColumn(col) },
    { icon: 'trash', label: 'Eliminar columna', danger: true, fn: () => deleteColumn(col) },
  ], { align: 'right' });
}

function openColumnModal(col) {
  let color = col.color;
  const m = openModal({
    title: 'Configurar columna', icon: 'sliders', size: 'sm',
    body: `<div class="field"><label class="field-label" for="cName">Nombre</label><input class="inp" id="cName" value="${esc(col.title)}" maxlength="60" autocomplete="off"></div>
      <div class="field"><div class="field-label">Color</div><div class="swatches" id="cColors">${COLUMN_COLORS.map(c => `<button type="button" class="swatch ${c === color ? 'on' : ''}" data-c="${c}" style="--sw:${c}" title="${c}"></button>`).join('')}</div></div>
      <div class="field"><label class="field-label" for="cWip">Límite de tareas (WIP)</label><input class="inp" type="number" id="cWip" min="0" max="99" value="${col.wip || 0}"><span class="hint">0 = sin límite. Te aviso cuando la columna lo supere, para no acumular trabajo a medias.</span></div>
      <label class="toggle-row"><input type="checkbox" id="cDone" ${col.isDone ? 'checked' : ''}><span class="switch"></span><span><strong>Columna de tareas completadas</strong><small>Sus tareas cuentan para el progreso y nunca aparecen como vencidas.</small></span></label>`,
    footer: `<span class="grow"></span><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="cSave">Guardar</button>`,
  });
  const el = m.el;
  setTimeout(() => $('#cName', el).focus(), 40);
  $('#cColors', el).addEventListener('click', e => {
    const s = e.target.closest('.swatch'); if (!s) return;
    color = s.dataset.c;
    $$('.swatch', el).forEach(x => x.classList.toggle('on', x === s));
  });
  const saveCol = () => {
    const name = $('#cName', el).value.trim();
    if (!name) { $('#cName', el).classList.add('invalid'); setTimeout(() => $('#cName', el).classList.remove('invalid'), 500); return; }
    const wasDone = col.isDone;
    col.title = name;
    col.color = color;
    col.wip = Math.max(0, Math.min(99, parseInt($('#cWip', el).value, 10) || 0));
    col.isDone = $('#cDone', el).checked;
    if (col.isDone !== wasDone) {
      const b = board();
      col.cardIds.forEach(id => { const c = b.cards[id]; if (c) c.completedAt = col.isDone ? (c.completedAt || Date.now()) : null; });
    }
    save(); m.close(); render();
    toast('Columna actualizada', { type: 'success' });
  };
  $('#cSave', el).onclick = saveCol;
  el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); saveCol(); } });
}

async function addColumn() {
  const name = await promptModal({ title: 'Nueva columna', ic: 'columns', label: 'Nombre de la columna', placeholder: 'Ej. Bloqueado, Esta semana…', confirmText: 'Crear columna' });
  if (!name) return;
  const b = board();
  b.columns.push({ id: uid(), title: name, color: COLUMN_COLORS[b.columns.length % COLUMN_COLORS.length], wip: 0, isDone: false, cardIds: [] });
  save(); render();
  boardEl.scrollTo({ left: boardEl.scrollWidth, behavior: 'smooth' });
  toast('Columna creada', { type: 'success' });
}

function inlineRename(h) {
  const colEl = h.closest('.column');
  const col = board().columns.find(c => c.id === colEl.dataset.id);
  const inp = document.createElement('input');
  inp.className = 'col-title-input';
  inp.value = col.title;
  inp.maxLength = 60;
  h.replaceWith(inp);
  inp.focus(); inp.select();
  let done = false;
  const finish = commit => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (commit && v && v !== col.title) { col.title = v; save(); }
    render();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.stopPropagation(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
  inp.addEventListener('pointerdown', e => e.stopPropagation());
}

function sortColumn(col, by) {
  const b = board();
  const cards = col.cardIds.map(id => b.cards[id]);
  if (by === 'priority') cards.sort((a, z) => PRIORITIES[a.priority].rank - PRIORITIES[z.priority].rank || (a.due || '9999').localeCompare(z.due || '9999'));
  else cards.sort((a, z) => (a.due || '9999').localeCompare(z.due || '9999') || PRIORITIES[a.priority].rank - PRIORITIES[z.priority].rank);
  col.cardIds = cards.map(c => c.id);
  save(); render();
  toast(by === 'priority' ? 'Ordenada por prioridad' : 'Ordenada por fecha límite', { type: 'success' });
}
function moveColumn(col, dir) {
  const cols = board().columns;
  const i = cols.indexOf(col), j = i + dir;
  if (j < 0 || j >= cols.length) return;
  [cols[i], cols[j]] = [cols[j], cols[i]];
  save(); render();
}
async function deleteColumn(col) {
  const b = board();
  const n = col.cardIds.length;
  if (n) {
    const ok = await confirmModal({ title: 'Eliminar columna', message: `“${col.title}” contiene ${n} tarea${n === 1 ? '' : 's'} que también se eliminará${n === 1 ? '' : 'n'}. Podrás deshacerlo justo después.`, confirmText: 'Eliminar', danger: true });
    if (!ok) return;
  }
  withUndo('Columna eliminada', () => {
    col.cardIds.forEach(id => delete b.cards[id]);
    b.columns = b.columns.filter(c => c !== col);
  });
}
function clearColumn(col) {
  const b = board();
  const n = col.cardIds.length;
  withUndo(`${n} tarea${n === 1 ? '' : 's'} eliminada${n === 1 ? '' : 's'}`, () => {
    col.cardIds.forEach(id => delete b.cards[id]);
    col.cardIds = [];
  });
}
function clearCompleted() {
  const b = board();
  const doneCols = b.columns.filter(c => c.isDone);
  const n = doneCols.reduce((s, c) => s + c.cardIds.length, 0);
  if (!n) { toast('No hay tareas completadas que limpiar'); return; }
  withUndo(`${n} tarea${n === 1 ? '' : 's'} completada${n === 1 ? '' : 's'} eliminada${n === 1 ? '' : 's'}`, () => {
    doneCols.forEach(c => { c.cardIds.forEach(id => delete b.cards[id]); c.cardIds = []; });
  });
}

/* =========================================================
   Tableros, etiquetas, datos
   ========================================================= */
function openBoardMenu(btn) {
  showMenu(btn, [
    { header: 'Tus tableros' },
    ...state.boards.map(bd => ({ icon: 'layout', label: bd.name, checked: bd.id === state.activeBoardId, fn: () => switchBoard(bd.id) })),
    { divider: true },
    { icon: 'plus', label: 'Nuevo tablero', fn: newBoard },
    { icon: 'edit', label: 'Renombrar tablero', fn: renameBoard },
    { icon: 'trash', label: 'Eliminar tablero', danger: true, disabled: state.boards.length < 2, fn: deleteBoard },
  ]);
}
function switchBoard(id) {
  if (id === state.activeBoardId) return;
  state.activeBoardId = id;
  clearFilters();
  save(); render();
  boardEl.scrollLeft = 0;
}
async function newBoard() {
  const name = await promptModal({ title: 'Nuevo tablero', ic: 'layout', label: 'Nombre del tablero', placeholder: 'Ej. Proyectos personales', confirmText: 'Crear tablero' });
  if (!name) return;
  const b = emptyBoard(name);
  state.boards.push(b);
  switchBoard(b.id);
  toast(`Tablero “${name}” creado`, { type: 'success' });
}
async function renameBoard() {
  const b = board();
  const name = await promptModal({ title: 'Renombrar tablero', ic: 'edit', label: 'Nombre del tablero', value: b.name });
  if (!name) return;
  b.name = name;
  save(); render();
}
async function deleteBoard() {
  const b = board();
  const n = Object.keys(b.cards).length;
  const ok = await confirmModal({ title: 'Eliminar tablero', message: `Se eliminará “${b.name}” con sus ${n} tarea${n === 1 ? '' : 's'}. Podrás deshacerlo justo después.`, confirmText: 'Eliminar tablero', danger: true });
  if (!ok) return;
  withUndo('Tablero eliminado', () => {
    state.boards = state.boards.filter(x => x !== b);
    state.activeBoardId = state.boards[0].id;
    clearFilters();
  });
}

function openLabelsModal() {
  const b = board();
  const m = openModal({
    title: 'Etiquetas', icon: 'tag', size: 'sm',
    body: `<p class="hint" style="margin:0 0 16px">Haz clic en el círculo para cambiar el color. Los cambios se aplican al momento.</p><div id="lblList"></div><button class="btn sm" id="lblAdd" type="button">${icon('plus')}Nueva etiqueta</button>`,
    footer: `<span class="grow"></span><button class="btn primary" data-close>Listo</button>`,
    onClose: () => { b.labels.forEach(l => { l.name = l.name.trim() || 'Sin nombre'; }); save(); render(); },
  });
  const list = $('#lblList', m.el);
  const usage = id => Object.values(b.cards).filter(c => c.labels.includes(id)).length;
  const draw = () => {
    list.innerHTML = b.labels.map(l => `<div class="lbl-row" data-id="${l.id}">
      <button type="button" class="lbl-dot" style="background:${esc(l.color)}" title="Cambiar color"></button>
      <input class="inp" value="${esc(l.name)}" maxlength="30" aria-label="Nombre de la etiqueta">
      <span class="lbl-count" title="Tareas con esta etiqueta">${usage(l.id)}</span>
      <button type="button" class="icon-btn sm" data-del title="Eliminar etiqueta">${icon('trash')}</button>
    </div>`).join('') || '<p class="hint">Aún no hay etiquetas.</p>';
  };
  draw();
  list.addEventListener('input', e => {
    const row = e.target.closest('.lbl-row'); if (!row || e.target.tagName !== 'INPUT') return;
    const l = b.labels.find(x => x.id === row.dataset.id); if (l) l.name = e.target.value;
  });
  list.addEventListener('click', async e => {
    const row = e.target.closest('.lbl-row'); if (!row) return;
    const l = b.labels.find(x => x.id === row.dataset.id); if (!l) return;
    if (e.target.closest('.lbl-dot')) {
      l.color = LABEL_COLORS[(LABEL_COLORS.indexOf(l.color) + 1) % LABEL_COLORS.length];
      e.target.closest('.lbl-dot').style.background = l.color;
      save();
    } else if (e.target.closest('[data-del]')) {
      const n = usage(l.id);
      if (n && !(await confirmModal({ title: 'Eliminar etiqueta', message: `“${l.name}” está en ${n} tarea${n === 1 ? '' : 's'}. Se quitará de todas.`, confirmText: 'Eliminar', danger: true }))) return;
      b.labels = b.labels.filter(x => x !== l);
      Object.values(b.cards).forEach(c => { c.labels = c.labels.filter(id => id !== l.id); });
      ui.fLabels.delete(l.id);
      save(); draw();
    }
  });
  $('#lblAdd', m.el).onclick = () => {
    b.labels.push({ id: uid(), name: 'Nueva etiqueta', color: LABEL_COLORS[b.labels.length % LABEL_COLORS.length] });
    save(); draw();
    const last = $$('.lbl-row input', list).at(-1);
    last.focus(); last.select();
  };
}

function openShortcuts() {
  const rows = [
    ['Nueva tarea', 'N'], ['Buscar', '/'], ['Abrir filtros', 'F'], ['Cambiar tema claro/oscuro', 'T'],
    ['Abrir la tarjeta seleccionada', 'Enter'], ['Guardar tarea', 'Ctrl + Enter'], ['Cerrar ventana o menú', 'Esc'], ['Ver esta ayuda', '?'],
  ];
  openModal({
    title: 'Atajos de teclado', icon: 'keyboard', size: 'sm',
    body: `<div class="shortcuts">${rows.map(([a, k]) => `<span>${a}</span><kbd>${k}</kbd>`).join('')}</div>
      <p class="hint" style="margin:18px 0 0">Consejo: en el móvil, mantén pulsada una tarjeta para arrastrarla.</p>`,
    footer: `<span class="grow"></span><button class="btn primary" data-close>Entendido</button>`,
  });
}

function openFilterPanel(anchor) {
  if (openPop?.anchor === anchor) { closePop(); return; }
  const b = board();
  const el = document.createElement('div');
  el.className = 'filter-panel';
  const draw = () => {
    el.innerHTML = `<div class="fp-head"><strong>Filtrar tareas</strong><button class="link" data-fclear>Limpiar</button></div>
      <div class="fp-section"><div class="fp-title">Prioridad</div><div class="fp-chips">${PRIORITY_ORDER.map(p => `<button class="chip prio-${p} ${ui.fPriorities.has(p) ? 'on' : ''}" data-fp="${p}"><i class="dot"></i>${PRIORITIES[p].label}</button>`).join('')}</div></div>
      <div class="fp-section"><div class="fp-title">Etiquetas</div><div class="fp-chips">${b.labels.length ? b.labels.map(l => `<button class="chip ${ui.fLabels.has(l.id) ? 'on' : ''}" data-fl="${l.id}"><i class="dot" style="background:${esc(l.color)}"></i>${esc(l.name)}</button>`).join('') : '<span class="hint">Aún no hay etiquetas</span>'}</div></div>
      <div class="fp-section"><div class="fp-title">Fecha límite</div><div class="fp-chips">${Object.entries(DUE_FILTERS).map(([k, v]) => `<button class="chip ${ui.fDue === k ? 'on' : ''}" data-fd="${k}">${v}</button>`).join('')}</div></div>`;
  };
  draw();
  const toggle = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
  el.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.fp) toggle(ui.fPriorities, t.dataset.fp);
    else if (t.dataset.fl) toggle(ui.fLabels, t.dataset.fl);
    else if (t.dataset.fd) ui.fDue = ui.fDue === t.dataset.fd ? '' : t.dataset.fd;
    else if (t.hasAttribute('data-fclear')) clearFilters();
    draw(); render();
  });
  showPopover(anchor, el, { align: 'right' });
}

function openMoreMenu(btn) {
  showMenu(btn, [
    { header: 'Tablero' },
    { icon: 'tag', label: 'Gestionar etiquetas', fn: openLabelsModal },
    { icon: 'sparkles', label: 'Limpiar tareas completadas', fn: clearCompleted },
    { divider: true },
    { header: 'Copia de seguridad' },
    { icon: 'download', label: 'Exportar datos (.json)', fn: exportData },
    { divider: true },
    { icon: 'keyboard', label: 'Atajos de teclado', hint: '?', fn: openShortcuts },
  ], { align: 'right' });
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `canvan-copia-${fmtISO(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast('Copia de seguridad exportada', { type: 'success' });
}
$('#importInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let data;
  try { data = normalizeState(JSON.parse(await file.text())); } catch { data = null; }
  if (!data) { toast('El archivo no es una copia válida de Canvan', { type: 'error' }); return; }
  const n = data.boards.reduce((s, b) => s + Object.keys(b.cards).length, 0);
  const ok = await confirmModal({ title: 'Importar copia', message: `Se reemplazarán tus datos actuales por ${data.boards.length} tablero${data.boards.length === 1 ? '' : 's'} y ${n} tarea${n === 1 ? '' : 's'} del archivo.`, confirmText: 'Importar' });
  if (!ok) return;
  withUndo('Datos importados', () => { state = data; clearFilters(); });
});

/* =========================================================
   Mover tarjetas + drag & drop
   ========================================================= */
function moveCard(id, toColId, beforeId, pt) {
  const b = board();
  const from = colOfCard(id, b);
  const to = b.columns.find(c => c.id === toColId);
  if (!from || !to) { render(); return; }
  from.cardIds = from.cardIds.filter(x => x !== id);
  const idx = beforeId ? to.cardIds.indexOf(beforeId) : -1;
  if (idx < 0) to.cardIds.push(id); else to.cardIds.splice(idx, 0, id);
  const card = b.cards[id];
  if (from !== to) {
    card.updatedAt = Date.now();
    if (to.isDone && !from.isDone) {
      card.completedAt = Date.now();
      if (pt) confetti(pt.x, pt.y);
      toast('¡Tarea completada! Buen trabajo', { type: 'success' });
    } else if (!to.isDone && from.isDone) card.completedAt = null;
    wipCheck(to);
  }
  save(); render();
}

function confetti(x, y) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#6d6dfa', '#a066f5', '#22c55e', '#f59e0b', '#ec4899', '#3b82f6'];
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('i');
    p.className = 'confetti';
    const a = Math.random() * Math.PI * 2, v = 50 + Math.random() * 100;
    p.style.cssText = `left:${x}px;top:${y}px;background:${colors[i % colors.length]};--dx:${Math.cos(a) * v}px;--dy:${Math.sin(a) * v - 50}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

let drag = null;
const nextCardAfter = node => {
  let n = node.nextElementSibling;
  while (n && (!n.classList.contains('card') || n.classList.contains('drag-source'))) n = n.nextElementSibling;
  return n;
};

boardEl.addEventListener('pointerdown', e => {
  if (e.button !== 0 || drag) return;
  const card = e.target.closest('.card');
  if (!card) return;
  drag = { id: card.dataset.id, cardEl: card, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, started: false, touch: e.pointerType === 'touch' };
  if (drag.touch) {
    drag.timer = setTimeout(() => {
      if (drag && !drag.started) { startDrag(); navigator.vibrate?.(12); }
    }, 320);
  }
});
window.addEventListener('pointermove', e => {
  if (!drag || drag.dropping) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.started) {
    const dist = Math.hypot(drag.x - drag.sx, drag.y - drag.sy);
    if (drag.touch) { if (dist > 10) { clearTimeout(drag.timer); drag = null; } return; }
    if (dist < 6) return;
    startDrag();
  }
  positionGhost();
  updateDropTarget();
});
window.addEventListener('pointerup', () => {
  if (!drag || drag.dropping) return;
  clearTimeout(drag.timer);
  if (drag.started) finishDrag();
  else { const id = drag.id; drag = null; openTaskModal(id); }
});
window.addEventListener('pointercancel', () => {
  if (!drag || drag.dropping) return;
  clearTimeout(drag.timer);
  if (drag.started) finishDrag(); else drag = null;
});
document.addEventListener('touchmove', e => { if (drag?.started) e.preventDefault(); }, { passive: false });
boardEl.addEventListener('contextmenu', e => { if (e.target.closest('.card') && drag) e.preventDefault(); });

function startDrag() {
  const d = drag, card = d.cardEl;
  const r = card.getBoundingClientRect();
  d.started = true;
  d.ox = d.sx - r.left; d.oy = d.sy - r.top;
  const g = card.cloneNode(true);
  g.classList.add('drag-ghost');
  g.style.width = r.width + 'px';
  g.style.height = r.height + 'px';
  document.body.appendChild(g);
  d.ghost = g;
  const ph = document.createElement('div');
  ph.className = 'card-placeholder';
  ph.style.height = r.height + 'px';
  card.before(ph);
  d.ph = ph;
  card.classList.add('drag-source');
  document.body.classList.add('is-dragging');
  closePop();
  positionGhost();
  updateDropTarget();
  d.raf = requestAnimationFrame(autoScroll);
}
function positionGhost() {
  const d = drag;
  d.ghost.style.transform = `translate3d(${d.x - d.ox}px, ${d.y - d.oy}px, 0) rotate(2.5deg)`;
}
function updateDropTarget() {
  const d = drag;
  const under = document.elementFromPoint(d.x, d.y);
  const colEl = under?.closest('.column');
  $$('.column.drop-target').forEach(c => { if (c !== colEl) c.classList.remove('drop-target'); });
  if (!colEl) return;
  colEl.classList.add('drop-target');
  const list = $('.card-list', colEl);
  let before = null;
  for (const c of list.children) {
    if (!c.classList.contains('card') || c.classList.contains('drag-source')) continue;
    const r = c.getBoundingClientRect();
    if (d.y < r.top + r.height / 2) { before = c; break; }
  }
  if (before) { if (d.ph.nextElementSibling !== before) list.insertBefore(d.ph, before); }
  else if (d.ph.parentElement !== list || nextCardAfter(d.ph)) list.appendChild(d.ph);
}
function autoScroll() {
  const d = drag;
  if (!d || !d.started || d.dropping) return;
  const speed = dist => Math.min(20, Math.max(2, dist / 3));
  const br = boardEl.getBoundingClientRect();
  const edge = 70;
  let moved = false;
  if (d.x < br.left + edge && boardEl.scrollLeft > 0) { boardEl.scrollLeft -= speed(br.left + edge - d.x); moved = true; }
  else if (d.x > br.right - edge) { const before = boardEl.scrollLeft; boardEl.scrollLeft += speed(d.x - (br.right - edge)); moved = boardEl.scrollLeft !== before; }
  const colEl = document.elementFromPoint(d.x, d.y)?.closest('.column');
  const list = colEl && $('.card-list', colEl);
  if (list) {
    const lr = list.getBoundingClientRect();
    if (d.y < lr.top + 40 && list.scrollTop > 0) { list.scrollTop -= speed(lr.top + 40 - d.y); moved = true; }
    else if (d.y > lr.bottom - 40 && list.scrollTop + list.clientHeight < list.scrollHeight) { list.scrollTop += speed(d.y - (lr.bottom - 40)); moved = true; }
  }
  if (moved) updateDropTarget();
  d.raf = requestAnimationFrame(autoScroll);
}
function finishDrag() {
  const d = drag;
  d.dropping = true;
  cancelAnimationFrame(d.raf);
  const list = d.ph.parentElement;
  const toCol = list.closest('.column').dataset.id;
  const next = nextCardAfter(d.ph);
  const r = d.ph.getBoundingClientRect();
  d.ghost.classList.add('dropping');
  d.ghost.style.transform = `translate3d(${r.left}px, ${r.top}px, 0) rotate(0deg)`;
  $$('.column.drop-target').forEach(c => c.classList.remove('drop-target'));
  setTimeout(() => {
    d.ghost.remove();
    document.body.classList.remove('is-dragging');
    drag = null;
    moveCard(d.id, toCol, next ? next.dataset.id : null, { x: r.left + r.width / 2, y: r.top + 24 });
  }, 170);
}

/* =========================================================
   Eventos globales
   ========================================================= */
boardEl.addEventListener('click', e => {
  const add = e.target.closest('[data-action="add-card"]');
  if (add) { openTaskModal(null, add.closest('.column').dataset.id); return; }
  const menu = e.target.closest('[data-action="col-menu"]');
  if (menu) { openColumnMenu(menu); return; }
  if (e.target.closest('[data-action="add-column"]')) addColumn();
});
boardEl.addEventListener('dblclick', e => { const t = e.target.closest('.col-title'); if (t) inlineRename(t); });
boardEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('card')) { e.preventDefault(); openTaskModal(e.target.dataset.id); }
});

$('#searchIcon').outerHTML = icon('search');
$('#filterBtn').insertAdjacentHTML('afterbegin', icon('filter'));
$('#moreBtn').innerHTML = icon('more');
$('#newTaskBtn').innerHTML = `${icon('plus')}<span class="new-label">Nueva tarea</span><kbd>N</kbd>`;
$('#saveState').innerHTML = `${icon('cloud')}<span>Guardado automático</span>`;

$('#newTaskBtn').onclick = () => openTaskModal();
$('#themeBtn').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
$('#moreBtn').onclick = e => openMoreMenu(e.currentTarget);
$('#filterBtn').onclick = e => openFilterPanel(e.currentTarget);
$('#boardSwitch').disabled = true; // en el portal se cambia de canvan desde el menú lateral
const searchIn = $('#search');
searchIn.addEventListener('input', () => { ui.q = searchIn.value.trim(); renderColumns(); renderActiveFilters(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (openPop) { closePop(); return; }
    if (modalStack.length) { modalStack.at(-1).requestClose(); return; }
    if (document.activeElement === searchIn) { searchIn.value = ''; ui.q = ''; searchIn.blur(); render(); }
    return;
  }
  if (modalStack.length || drag) return;
  if (e.target.matches('input, textarea, select, [contenteditable="true"]')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); openTaskModal(); }
  else if (k === '/') { e.preventDefault(); searchIn.focus(); searchIn.select(); }
  else if (k === 'f') { e.preventDefault(); openFilterPanel($('#filterBtn')); }
  else if (k === 't') { e.preventDefault(); $('#themeBtn').click(); }
  else if (e.key === '?') { e.preventDefault(); openShortcuts(); }
});

// Si se cambia el tema desde el portal, se aplica también acá
window.addEventListener('storage', e => {
  if (e.key === THEME_KEY && (e.newValue === 'dark' || e.newValue === 'light')) { state.theme = e.newValue; applyTheme(); }
});

// Trae los cambios que hagan otras personas mientras el canvan está abierto
setInterval(async () => {
  if (document.hidden || dirty || drag || modalStack.length || openPop) return;
  try {
    const remote = await fetchRemote();
    if (remote.rev === rev || dirty) return;
    rev = remote.rev;
    state = stateFrom(remote.board);
    render();
  } catch {}
}, 15000);
// Refresca los "Hoy / Mañana / Vencida" al cambiar de día
let lastDay = fmtISO(new Date());
setInterval(() => { const d = fmtISO(new Date()); if (d !== lastDay && !drag && !modalStack.length) { lastDay = d; render(); } }, 60000);

render();
})();
</script>
