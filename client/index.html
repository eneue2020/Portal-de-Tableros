<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal de Tableros</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='2' width='9' height='9' rx='2' fill='%235b5bd6'/><rect x='13' y='2' width='9' height='9' rx='2' fill='%239b9bf0'/><rect x='2' y='13' width='9' height='9' rx='2' fill='%239b9bf0'/><rect x='13' y='13' width='9' height='9' rx='2' fill='%235b5bd6'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
    <script>
      // Aplica el tema elegido antes de pintar, para evitar un parpadeo
      try {
        const tema = localStorage.getItem('portal.tema');
        if (tema === 'dark' || tema === 'light') document.documentElement.dataset.theme = tema;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
